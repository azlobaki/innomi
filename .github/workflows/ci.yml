name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The runner ships Google Chrome; the regression test drives it headless
      # and fails on any request leaving the page, any page error, any text
      # reaching storage, any overflow, any control pushed off screen.
      - run: npm run smoke
        env:
          CHROME: google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke/
          if-no-files-found: ignore
